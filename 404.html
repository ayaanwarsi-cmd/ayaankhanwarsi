<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #08080e 0%, #1a1a2e 100%);
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-size: 120px;
      font-weight: bold;
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 20px 0;
      line-height: 1;
    }

    h1 {
      font-size: 32px;
      margin: 20px 0;
      font-weight: 600;
      color: #ffffff;
    }

    p {
      font-size: 18px;
      color: #b8b8c8;
      margin: 20px 0;
      line-height: 1.6;
    }

    .actions {
      margin: 40px 0;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
    }

    .btn-secondary {
      border: 2px solid #ff6b35;
      color: #ff6b35;
    }

    .btn-secondary:hover {
      background: rgba(255, 107, 53, 0.1);
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Go to Homepage</a>
      <a href="/sitemap.xml" class="btn-secondary">View Sitemap</a>
    </div>
  </div>
</body>
</html>
